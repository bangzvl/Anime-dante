<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnimeKu — Streaming Anime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --surface:#161618; --surface-2:#1f1f22; --line:#2a2a2e;
  --text:#f4f4f5; --muted:#9a9aa1; --lime:#c8f43a; --lime-ink:#141a02;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:110px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- Top segmented tabs ---------- */
.topbar{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 0 12px;
  background:linear-gradient(var(--bg) 70%,transparent)}
.topbar .wrap{display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.logo span{color:var(--lime)}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.2s}
.seg button.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px #3a3a3f}
@media(max-width:620px){.logo{display:none}.seg{flex:1;justify-content:space-between}.seg button{padding:8px 10px;font-size:12.5px}}

/* ---------- Section headers ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:21px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.sec-h .all{font-size:13px;color:var(--muted);font-weight:600}
.sec-h .all:hover{color:var(--lime)}

/* ---------- Horizontal rows ---------- */
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.row::-webkit-scrollbar{display:none}

/* Poster card */
.card{flex:0 0 140px;scroll-snap-align:start;cursor:pointer}
.card .pic{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--surface)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover img{transform:scale(1.05)}
.badge{position:absolute;top:8px;left:8px;background:var(--lime);color:var(--lime-ink);font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:7px}
.badge.dim{background:rgba(0,0,0,.7);color:var(--text);backdrop-filter:blur(6px)}
.card .t{margin-top:8px;font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:12px;color:var(--muted);margin-top:2px}
@media(min-width:900px){.card{flex-basis:170px}}

/* Top-10 card with outlined numeral */
.rank{flex:0 0 200px;display:flex;align-items:flex-end;cursor:pointer;scroll-snap-align:start}
.rank .num{font-size:128px;font-weight:800;line-height:.78;letter-spacing:-.08em;color:transparent;
  -webkit-text-stroke:2px rgba(255,255,255,.75);margin-right:-18px;z-index:1;user-select:none;padding-bottom:42px}
.rank .body{width:120px;flex:none}
.rank .pic{aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--surface)}
.rank img{width:100%;height:100%;object-fit:cover}
.rank .t{margin-top:8px;font-size:13px;font-weight:600;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rank.ten{flex-basis:240px}.rank.ten .num{letter-spacing:-.12em}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}}
.grid .card{flex:none}

/* Skeleton */
.sk{background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Detail ---------- */
.hero{position:relative;height:min(78vh,620px);overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:saturate(1.05)}
.hero .bg.blur{filter:blur(28px) brightness(.55);transform:scale(1.2)}
.hero .poster{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);height:62%;aspect-ratio:2/3;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.hero .poster img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,12,.25) 0%,transparent 30%,rgba(11,11,12,.75) 72%,var(--bg) 100%)}
.hero .top{position:absolute;z-index:3;left:0;right:0;top:calc(env(safe-area-inset-top) + 14px)}
.hero .top .wrap{display:flex;justify-content:space-between}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,22,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.fav svg{fill:none;stroke:currentColor}
.icon-btn.fav.on svg{fill:var(--lime);stroke:var(--lime)}
.hero .bottom{position:absolute;z-index:3;left:0;right:0;bottom:20px;text-align:center}
.hero h1{font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05;text-shadow:0 4px 30px rgba(0,0,0,.6);padding:0 18px}
.hero .jp{color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;justify-content:center;gap:10px;margin-top:16px}
.btn-lime{display:inline-flex;align-items:center;gap:8px;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:15px;padding:13px 22px;border-radius:999px;transition:transform .15s}
.btn-lime:active{transform:scale(.97)}
.btn-lime svg{width:18px;height:18px;fill:currentColor}
.btn-lime[disabled]{opacity:.4;cursor:not-allowed}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--muted);margin-top:8px}
.meta b{color:var(--text);font-weight:700}
.meta .sc{color:var(--lime);font-weight:800}
.meta .dot{width:3px;height:3px;border-radius:50%;background:#55555b}
.syn{margin-top:14px;font-size:14.5px;line-height:1.6;color:#d6d6da;max-width:760px}
.syn.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--lime);font-weight:700;font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
a.chip:hover{border-color:var(--lime);color:var(--lime)}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.info div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.info small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:3px}
.info span{font-size:14px;font-weight:700}

.ep-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ep{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ep .n{flex:none;width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;color:var(--lime);font-size:14px}
.ep .tt{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep .d{font-size:12px;color:var(--muted);margin-top:2px}
.ep>div{min-width:0}

/* ---------- Search ---------- */
.search-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-top:8px}
.search-box:focus-within{border-color:var(--lime)}
.search-box svg{width:20px;height:20px;color:var(--muted);flex:none}
.search-box input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:14px 0}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px 0 18px}
.days::-webkit-scrollbar{display:none}
.days button{padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.days button.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}

.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.err{background:#2a1515;border:1px solid #4a2222;color:#ffb4b4;border-radius:12px;padding:14px;font-size:13.5px;margin-top:16px}
.err button{color:var(--lime);font-weight:700;margin-left:6px}
.load-more{display:block;margin:24px auto 0;padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.load-more:hover{border-color:var(--lime)}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}

/* ---------- Bottom floating nav ---------- */
.dock{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:10px;align-items:center}
.dock nav{display:flex;gap:4px;background:rgba(28,28,31,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px}
.dock nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 18px;border-radius:999px;font-size:11px;font-weight:600;color:#c9c9ce;min-width:76px}
.dock nav a svg{width:22px;height:22px}
.dock nav a.on{background:#2c2c30;color:var(--lime)}
.dock .sbtn{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(28,28,31,.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08)}
.dock .sbtn.on{color:var(--lime)}
.dock .sbtn svg{width:22px;height:22px}

/* ---------- Trailer modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal .box{width:100%;max-width:960px}
.modal .vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.mhead>div{flex:1;min-width:0}
.mt{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.mctrl button[disabled]{opacity:.35;cursor:not-allowed}
.mctrl a{font-size:13px;color:var(--muted);font-weight:600;text-decoration:underline;text-align:center}
[hidden]{display:none!important}

/* ---------- YouTube episodes ---------- */
.gear{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);margin-left:auto}
.gear.on,.gear:hover{color:var(--lime)}
.gear svg{width:20px;height:20px}
.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 12px}
.yt-ep{display:block;width:100%;text-align:left;cursor:pointer}
.yt-ep .th,.cont .th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface)}
.yt-ep img,.cont img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.yt-ep:hover img,.cont:hover img{transform:scale(1.04)}
.yt-ep .no{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.75);font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:7px}
.yt-ep .no.lime{background:var(--lime);color:var(--lime-ink)}
.yt-ep .tt{margin-top:7px;font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.pl-chips::-webkit-scrollbar{display:none}
.pl-chips button{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-chips button.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;line-height:1.55;color:#d6d6da}
.notice b{color:var(--text)}
.notice .btn-lime{margin-top:12px;font-size:14px;padding:11px 18px}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.btn-ghost:hover{border-color:var(--lime)}
.cont{flex:0 0 240px;display:block;text-align:left;cursor:pointer;scroll-snap-align:start}
.cont .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 60%)}
.cont .play span{width:44px;height:44px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.cont .play svg{width:18px;height:18px;fill:currentColor}
.cont .t{margin-top:8px;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Settings ---------- */
.form{display:flex;flex-direction:column;gap:18px;max-width:640px;margin-top:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.5}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:15px;padding:13px 14px;outline:0}
.input:focus{border-color:var(--lime)}
textarea.input{min-height:130px;resize:vertical;line-height:1.5}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.status{font-size:13.5px;font-weight:600;min-height:1em}
.status.ok{color:var(--lime)}.status.bad{color:#ff9b9b}
.steps{padding-left:20px;color:#d6d6da;font-size:14px;line-height:1.75;max-width:720px}
.steps a{color:var(--lime);text-decoration:underline}

.foot{color:#5c5c63;font-size:11.5px;text-align:center;margin-top:40px;line-height:1.6}
.foot a{color:#8a8a91;text-decoration:underline}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="wrap">
    <div class="logo">Anime<span>Ku</span></div>
    <div class="seg" id="seg">
      <button data-tab="home" class="on">Beranda</button>
      <button data-tab="airing">Sedang Tayang</button>
      <button data-tab="movie">Film</button>
      <button data-tab="upcoming">Segera</button>
    </div>
    <a href="#pengaturan" class="gear" data-nav="pengaturan" aria-label="Pengaturan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>

<main id="app"></main>

<div class="dock">
  <nav>
    <a href="#" data-nav="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg>Beranda</a>
    <a href="#favorit" data-nav="favorit"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>Favorit</a>
    <a href="#jadwal" data-nav="jadwal"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zm-2 8h14v10H5z"/></svg>Jadwal</a>
  </nav>
  <a href="#cari" class="sbtn" data-nav="cari" aria-label="Cari"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="box">
    <div class="mhead">
      <div><div class="mt" id="mtitle"></div><div class="ms" id="msub"></div></div>
      <button class="icon-btn" id="mclose" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="vid" id="vid"></div>
    <div class="mctrl">
      <button class="btn-ghost" id="mprev">‹ Sebelumnya</button>
      <a id="myt" href="#" target="_blank" rel="noopener">Buka di YouTube</a>
      <button class="btn-ghost" id="mnext">Berikutnya ›</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Data: AniList GraphQL API — https://anilist.co (gratis, tanpa key)
   api(path) menerima path bergaya lama dan mengembalikan data
   dengan bentuk yang sama, jadi tampilan tidak perlu diubah.
   ========================================================= */
const AL = 'https://graphql.anilist.co';
const cache = new Map();
let queue = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function gql(query, variables){
  const p = queue = queue.then(async () => {
    for (let i = 0; i < 4; i++){
      let res;
      try {
        res = await fetch(AL, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body: JSON.stringify({ query, variables }) });
      } catch {
        throw new Error(/^https?:$/.test(location.protocol)
          ? 'Tidak bisa terhubung ke AniList. Cek koneksi internet lalu coba lagi.'
          : 'Halaman dibuka sebagai file lokal, jadi browser memblokir akses internet. Upload ke hosting (mis. Netlify Drop) lalu buka lewat link https.');
      }
      if (res.status === 429){ await sleep((+res.headers.get('Retry-After') || 3) * 1000); continue; }
      const j = await res.json().catch(() => ({}));
      if (!res.ok || j.errors) throw new Error(j.errors?.[0]?.message || 'HTTP ' + res.status);
      await sleep(250);
      return j.data;
    }
    throw new Error('Terlalu banyak permintaan, coba lagi sebentar.');
  });
  queue = p.catch(() => {});
  return p;
}

const CARD = `id title{romaji english native} synonyms coverImage{extraLarge large} averageScore seasonYear episodes format isAdult popularity`;
const fmtID = { TV:'TV', TV_SHORT:'TV', MOVIE:'Movie', OVA:'OVA', ONA:'ONA', SPECIAL:'Special', MUSIC:'Music' };
const statusEN = { RELEASING:'Currently Airing', FINISHED:'Finished Airing', NOT_YET_RELEASED:'Not yet aired', CANCELLED:'Cancelled', HIATUS:'Hiatus' };
const stripHTML = s => decodeEnt(String(s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '')).trim();
function decodeEnt(s){ const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }

// Ubah objek Media AniList ke bentuk yang dipakai tampilan.
function normMedia(m){
  if (!m) return null;
  const yt = m.trailer?.site === 'youtube' ? m.trailer.id : null;
  const rated = (m.rankings || []).find(r => r.type === 'RATED' && r.allTime);
  return {
    mal_id: m.id,
    title: m.title?.romaji || m.title?.english || '',
    title_english: m.title?.english || null,
    title_japanese: m.title?.native || null,
    title_synonyms: m.synonyms || [],
    images: { webp: { large_image_url: m.coverImage?.extraLarge || m.coverImage?.large || '' } },
    score: m.averageScore ? m.averageScore / 10 : null,
    year: m.seasonYear || m.startDate?.year || null,
    episodes: m.episodes || null,
    type: fmtID[m.format] || m.format || null,
    members: m.popularity || null,
    rank: rated?.rank || null,
    synopsis: stripHTML(m.description),
    genres: (m.genres || []).map(name => ({ name })),
    themes: [],
    trailer: { youtube_id: yt },
    streaming: (m.externalLinks || []).filter(l => l.type === 'STREAMING').map(l => ({ name: l.site, url: l.url })),
    studios: (m.studios?.nodes || []).map(s => ({ name: s.name })),
    status: statusEN[m.status] || m.status,
    duration: m.duration ? m.duration + ' min per ep' : null,
    season: m.season ? m.season.toLowerCase() : null,
    rating: m.isAdult ? 'Dewasa' : null,
    _eps: (m.streamingEpisodes || []).map((e, i) => ({ mal_id: i + 1, title: e.title, aired: null })),
    _recs: (m.recommendations?.nodes || []).map(n => n.mediaRecommendation).filter(Boolean).map(normMedia),
  };
}
function currentSeason(){
  const d = new Date(), mo = d.getMonth();
  return { season: ['WINTER','WINTER','WINTER','SPRING','SPRING','SPRING','SUMMER','SUMMER','SUMMER','FALL','FALL','FALL'][mo], year: d.getFullYear() };
}
async function pageQuery(args, page = 1, perPage = 20){
  const d = await gql(`query($page:Int,$perPage:Int){Page(page:$page,perPage:$perPage){pageInfo{hasNextPage} media(type:ANIME,isAdult:false,${args}){${CARD}}}}`, { page, perPage });
  return { data: d.Page.media.map(normMedia), pagination: { has_next_page: d.Page.pageInfo.hasNextPage } };
}
const mediaCache = new Map();
function getMedia(id){
  if (!mediaCache.has(id)){
    const p = gql(`query($id:Int){Media(id:$id,type:ANIME){${CARD} description(asHtml:false) bannerImage status duration season startDate{year}
      genres trailer{id site} rankings{rank type allTime} studios(isMain:true){nodes{name}}
      externalLinks{site url type} streamingEpisodes{title}
      recommendations(perPage:14,sort:RATING_DESC){nodes{mediaRecommendation{${CARD}}}}}}`, { id: +id }).then(d => normMedia(d.Media));
    mediaCache.set(id, p);
    p.catch(() => mediaCache.delete(id));
  }
  return mediaCache.get(id);
}
const DAYS = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
async function schedule(day){
  const now = new Date(), dow = (now.getDay() + 6) % 7, target = DAYS.indexOf(day);
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (target - dow));
  const from = Math.floor(start / 1000), to = from + 86400;
  const d = await gql(`query($from:Int,$to:Int){Page(perPage:50){airingSchedules(airingAt_greater:$from,airingAt_lesser:$to,sort:TIME){airingAt episode media{${CARD}}}}}`, { from, to });
  return { data: d.Page.airingSchedules.filter(s => s.media && !s.media.isAdult).map(s => normMedia(s.media)) };
}

// Adapter: path lama → query AniList.
function api(path){
  if (cache.has(path)) return cache.get(path);
  const u = new URL(path, 'https://x'), q = u.searchParams, page = +q.get('page') || 1, limit = +q.get('limit') || 20;
  const { season, year } = currentSeason();
  let p, m;
  if ((m = u.pathname.match(/^\/anime\/(\d+)\/full$/))) p = getMedia(m[1]).then(a => ({ data: a }));
  else if ((m = u.pathname.match(/^\/anime\/(\d+)\/episodes$/))) p = getMedia(m[1]).then(a => ({ data: a._eps }));
  else if ((m = u.pathname.match(/^\/anime\/(\d+)\/recommendations$/))) p = getMedia(m[1]).then(a => ({ data: a._recs.map(entry => ({ entry })) }));
  else if (u.pathname === '/anime') p = pageQuery(`search:${JSON.stringify(q.get('q') || '')},sort:[SEARCH_MATCH,POPULARITY_DESC]`, page, limit);
  else if (u.pathname === '/schedules') p = schedule(q.get('filter'));
  else if (u.pathname === '/seasons/now') p = pageQuery(`season:${season},seasonYear:${year},sort:POPULARITY_DESC`, page, limit);
  else if (u.pathname === '/seasons/upcoming') p = pageQuery(`status:NOT_YET_RELEASED,sort:POPULARITY_DESC`, page, limit);
  else if (u.pathname === '/top/anime'){
    const f = q.get('filter'), t = q.get('type');
    if (f === 'airing') p = pageQuery(`status:RELEASING,popularity_greater:5000,sort:SCORE_DESC`, page, limit);
    else if (f === 'bypopularity') p = pageQuery(`sort:POPULARITY_DESC`, page, limit);
    else if (t === 'movie') p = pageQuery(`format:MOVIE,popularity_greater:10000,sort:SCORE_DESC`, page, limit);
    else p = pageQuery(`sort:SCORE_DESC,popularity_greater:10000`, page, limit);
  }
  else p = Promise.reject(new Error('Endpoint tidak dikenal: ' + path));
  cache.set(path, p);
  p.catch(() => cache.delete(path));
  return p;
}
const uniq = arr => { const s = new Set(); return arr.filter(a => !s.has(a.mal_id) && s.add(a.mal_id)); };

/* ---------- Favorites (localStorage, safe) ---------- */
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('animeku-fav-al') || '[]'); } catch { return memFav; } },
  set(v){ memFav = v; try { localStorage.setItem('animeku-fav-al', JSON.stringify(v)); } catch {} }
};
let memFav = [];
const isFav = id => store.get().some(a => a.mal_id === id);
function toggleFav(a){
  const list = store.get();
  const i = list.findIndex(x => x.mal_id === a.mal_id);
  if (i >= 0) list.splice(i, 1);
  else list.unshift({ mal_id:a.mal_id, title:a.title, score:a.score, year:a.year, type:a.type, images:{ webp:{ large_image_url:img(a) } } });
  store.set(list);
  return i < 0;
}

/* =========================================================
   Episode resmi: YouTube Data API v3 (channel Muse & Ani-One)
   ========================================================= */
const CONFIG = {
  // Opsional: isi key di sini saat hosting supaya pengunjung tidak perlu memasukkannya.
  // Batasi key di Google Cloud (Websites + YouTube Data API v3) karena key ini terlihat publik.
  YT_API_KEY: '',
  CHANNELS: ['Muse Indonesia', 'Ani-One Indonesia', 'Muse ID dub TV', 'Muse Asia', 'Ani-One Asia'],
};
function jsonStore(key, fallback){
  let mem = fallback;
  return {
    get(){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : mem; } catch { return mem; } },
    set(v){ mem = v; try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }
  };
}
const settings = jsonStore('animeku-settings', {});
const hist = jsonStore('animeku-history-al', []);
const ytKey = () => (settings.get().ytKey || CONFIG.YT_API_KEY || '').trim();
const ytChannels = () => { const c = settings.get().channels; return c && c.length ? c : CONFIG.CHANNELS; };

const ytCache = {
  get(k){ try { const v = JSON.parse(localStorage.getItem('animeku-yt:' + k)); if (v && Date.now() - v.t < 12 * 3600e3) return v.d; } catch {} return null; },
  set(k, d){ try { localStorage.setItem('animeku-yt:' + k, JSON.stringify({ t: Date.now(), d })); } catch {} },
  clear(){ try { Object.keys(localStorage).filter(k => k.startsWith('animeku-yt:')).forEach(k => localStorage.removeItem(k)); } catch {} }
};
async function yt(endpoint, params){
  const key = ytKey(); if (!key) throw new Error('API key YouTube belum dipasang');
  const ck = endpoint + '?' + new URLSearchParams(params);
  const hit = ytCache.get(ck); if (hit) return hit;
  const res = await fetch('https://www.googleapis.com/youtube/v3/' + endpoint + '?' + new URLSearchParams({ ...params, key }));
  const j = await res.json().catch(() => ({}));
  if (!res.ok){
    const reason = j.error?.errors?.[0]?.reason;
    if (reason === 'quotaExceeded') throw new Error('Kuota harian YouTube API habis. Coba lagi besok.');
    throw new Error(j.error?.message?.replace(/<[^>]+>/g, '') || 'HTTP ' + res.status);
  }
  ytCache.set(ck, j);
  return j;
}
const decode = s => { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; };
const normT = s => String(s || '').toLowerCase().replace(/[×✕]/g, 'x').normalize('NFKD').replace(/[^a-z0-9]/g, '');
const channelRank = name => { const n = normT(name); return ytChannels().findIndex(c => normT(c) === n); };
function titleKeys(a){
  const raw = [a.title_english, a.title, ...(a.title_synonyms || [])].filter(Boolean);
  const keys = new Set();
  raw.forEach(t => { keys.add(normT(t)); keys.add(normT(t.split(/[:：–]| - /)[0])); });
  const all = [...keys].filter(Boolean);
  const long = all.filter(k => k.length >= 4);
  return long.length ? long : all;
}
const matchesTitle = (s, keys) => { const n = normT(s); return keys.some(k => n.includes(k)); };

async function findOfficial(a){
  const keys = titleKeys(a);
  const queries = [...new Set([a.title_english, a.title].filter(Boolean))];
  const pls = new Map();
  for (const q of queries){
    const r = await yt('search', { part:'snippet', type:'playlist', q, maxResults:25, regionCode:'ID' });
    for (const it of r.items || []){
      const s = it.snippet, rank = channelRank(s.channelTitle), t = decode(s.title);
      if (rank >= 0 && matchesTitle(t, keys) && !pls.has(it.id.playlistId))
        pls.set(it.id.playlistId, { id: it.id.playlistId, title: t, channel: s.channelTitle, rank });
    }
    if (pls.size) break;
  }
  const playlists = [...pls.values()].sort((x, y) => x.rank - y.rank);
  if (playlists.length) return { playlists, videos: [] };
  // Tidak ada playlist: cari video satuan dari channel resmi.
  const r = await yt('search', { part:'snippet', type:'video', q: queries[0] + ' episode', maxResults:50, regionCode:'ID' });
  const videos = (r.items || [])
    .filter(it => channelRank(it.snippet.channelTitle) >= 0 && matchesTitle(decode(it.snippet.title), keys))
    .sort((x, y) => x.snippet.publishedAt.localeCompare(y.snippet.publishedAt))
    .map(it => ({ videoId: it.id.videoId, title: decode(it.snippet.title), thumb: it.snippet.thumbnails?.medium?.url || '', channel: it.snippet.channelTitle }));
  return { playlists: [], videos };
}
async function playlistItems(id){
  const items = []; let token = '';
  for (let i = 0; i < 4; i++){ // maks. 200 video
    const r = await yt('playlistItems', { part:'snippet', playlistId:id, maxResults:50, ...(token ? { pageToken: token } : {}) });
    items.push(...(r.items || [])); token = r.nextPageToken; if (!token) break;
  }
  return items
    .filter(it => it.snippet?.resourceId?.videoId && !/^(private|deleted) video$/i.test(it.snippet.title))
    .map(it => ({ videoId: it.snippet.resourceId.videoId, title: decode(it.snippet.title),
      thumb: it.snippet.thumbnails?.medium?.url || it.snippet.thumbnails?.default?.url || '' }));
}
function saveHistory(p){
  const cur = p.list[p.index];
  const list = hist.get().filter(h => h.mal_id !== p.anime.mal_id);
  list.unshift({ mal_id: p.anime.mal_id, title: p.title, playlistId: p.playlistId || null, videoId: cur.videoId, epTitle: cur.title, t: Date.now() });
  hist.set(list.slice(0, 20));
}
async function resume(h){
  let list = [{ videoId: h.videoId, title: h.epTitle }], index = 0;
  if (h.playlistId && ytKey()){
    try { const l = await playlistItems(h.playlistId); const i = l.findIndex(x => x.videoId === h.videoId); if (i >= 0){ list = l; index = i; } } catch {}
  }
  openPlayer({ title: h.title, anime: { mal_id: h.mal_id }, playlistId: h.playlistId, list, index });
}

async function viewList(key){
  const id = ++renderId, L = lists[key]; let page = 1, seen = new Set();
  $app.innerHTML = `<div class="wrap"><h1 class="page-title">${L.title}</h1><div class="sec" id="g">${skelGrid(12)}</div><div id="lm"></div>${footer}</div>`;
  const grid = document.getElementById('g');
  async function load(){
    try {
      const d = await api(L.path(page)); if (id !== renderId) return;
      if (page === 1) grid.innerHTML = '<div class="grid"></div>';
      const items = d.data.filter(a => !seen.has(a.mal_id) && seen.add(a.mal_id));
      grid.firstChild.insertAdjacentHTML('beforeend', items.map(cardHTML).join(''));
      const lm = document.getElementById('lm');
      lm.innerHTML = d.pagination?.has_next_page ? `<button class="load-more">Muat lebih banyak</button>` : '';
      const b = lm.querySelector('button'); if (b) b.onclick = () => { b.textContent = 'Memuat…'; page++; load(); };
    } catch(e){ grid.innerHTML = errHTML(e.message, 'route()'); }
  }
  load();
}

    <button class="more" id="morebtn">Selengkapnya</button>

    <section class="sec" id="watch-sec"><div class="sec-h"><h2>Tonton Episode</h2><span class="all" id="watch-src"></span></div><div id="watch"></div></section>

    ${streams.length ? `<section class="sec"><div class="sec-h"><h2>Tonton di</h2></div>
      <div class="chips">${streams.map(s => `<a class="chip" href="${esc(s.url)}" target="_blank" rel="noopener">▶ ${esc(s.name)}</a>`).join('')}</div></section>` : ''}

    <section class="sec"><div class="sec-h"><h2>Info</h2></div>
      <div class="info">
        <div><small>Status</small><span>${esc(statusID[a.status] || a.status || '-')}</span></div>
        <div><small>Studio</small><span>${esc((a.studios||[]).map(s=>s.name).join(', ') || '-')}</span></div>
        <div><small>Durasi</small><span>${esc((a.duration||'-').replace('per ep','/ eps').replace(' min',' mnt').replace(' hr',' jam'))}</span></div>
        <div><small>Musim</small><span>${esc(a.season ? a.season[0].toUpperCase()+a.season.slice(1)+' '+(a.year||'') : '-')}</span></div>
        <div><small>Rating usia</small><span>${esc((a.rating||'-').split(' - ')[0])}</span></div>
        <div><small>Popularitas</small><span>${a.members ? a.members.toLocaleString('id-ID') : '-'}</span></div>
      </div>
      ${genres.length ? `<div class="chips">${genres.map(g=>`<span class="chip">${esc(g.name)}</span>`).join('')}</div>` : ''}
    </section>

    <section class="sec" id="eps-sec"><div class="sec-h"><h2>Info Episode</h2><span class="all" id="eps-count"></span></div><div id="eps"><div class="sk" style="height:60px;border-radius:12px"></div></div></section>
    <section class="sec" id="rec-sec"><div class="sec-h"><h2>Mungkin Kamu Suka</h2></div><div class="row" id="rec">${skelRow(6)}</div></section>
    ${footer}
  </div>`;

  document.getElementById('favbtn').onclick = e => e.currentTarget.classList.toggle('on', toggleFav(a));
  // ----- Tombol putar + episode YouTube resmi -----
  const playBtn = document.getElementById('play'), trBtn = document.getElementById('trailerBtn');
  const watch = document.getElementById('watch'), watchSrc = document.getElementById('watch-src');
  const trailerFn = yt ? () => openTrailer(yt, title(a)) : null;
  const setPlay = (label, fn) => { playBtn.querySelector('span').textContent = label; playBtn.disabled = !fn; playBtn.onclick = fn; };
  const fallback = () => setPlay(yt ? 'Tonton Trailer' : 'Trailer belum ada', trailerFn);
  setPlay(playBtn.querySelector('span').textContent, ytKey() ? null : trailerFn);

  function renderEps(list, playlistId, channel, body){
    if (id !== renderId) return;
    watchSrc.textContent = channel + ' · ' + list.length + ' video';
    if (!list.length){ body.innerHTML = `<div class="notice">Playlist ini belum berisi video.</div>`; return; }
    const h = hist.get().find(x => x.mal_id === a.mal_id);
    const last = h ? list.findIndex(x => x.videoId === h.videoId) : -1;
    body.innerHTML = `<div class="yt-grid">${list.map((v, i) => `
      <button class="yt-ep fade" data-i="${i}"><div class="th"><img loading="lazy" src="${esc(v.thumb)}" alt="">
      <span class="no ${i === last ? 'lime' : ''}">${i === last ? 'Terakhir ditonton' : '#' + (i + 1)}</span></div>
      <div class="tt">${esc(v.title)}</div></button>`).join('')}</div>`;
    const play = i => openPlayer({ title: title(a), anime: { mal_id: a.mal_id }, playlistId, list, index: i });
    body.querySelector('.yt-grid').onclick = e => { const b = e.target.closest('.yt-ep'); if (b) play(+b.dataset.i); };
    setPlay(last >= 0 ? 'Lanjut #' + (last + 1) : 'Tonton #1', () => play(Math.max(last, 0)));
  }

  async function loadWatch(){
    if (!ytKey()){
      watch.innerHTML = `<div class="notice"><b>Tonton episode lengkap secara legal</b><br>Pasang YouTube API key (gratis) supaya AnimeKu bisa memutar episode resmi dari channel Muse dan Ani-One.<br><a class="btn-lime" href="#pengaturan">Pasang API key</a></div>`;
      return;
    }
    watch.innerHTML = skelYT(4);
    try {
      const found = await findOfficial(a); if (id !== renderId) return;
      if (!found.playlists.length && !found.videos.length){
        watch.innerHTML = `<div class="notice">Judul ini belum tersedia di channel YouTube resmi (${esc(ytChannels().join(', '))}).${streams.length ? ' Kamu bisa menontonnya lewat platform di bawah.' : ''}</div>`;
        return fallback();
      }
      document.getElementById('eps-sec')?.remove();
      if (trBtn){ trBtn.hidden = false; trBtn.onclick = trailerFn; }
      if (!found.playlists.length) return renderEps(found.videos, null, found.videos[0].channel, watch);

      const pls = found.playlists;
      const h = hist.get().find(x => x.mal_id === a.mal_id);
      let cur = Math.max(0, h?.playlistId ? pls.findIndex(p => p.id === h.playlistId) : 0);
      const showPl = async () => {
        const pl = pls[cur];
        watch.innerHTML = (pls.length > 1 ? `<div class="pl-chips">${pls.map((p, i) => `<button data-pl="${i}" class="${i === cur ? 'on' : ''}">${esc(p.title)}</button>`).join('')}</div>` : '')
          + `<div id="pl-body">${skelYT(4)}</div>`;
        watchSrc.textContent = pl.channel;
        const chips = watch.querySelector('.pl-chips');
        if (chips) chips.onclick = e => { const b = e.target.closest('[data-pl]'); if (b){ cur = +b.dataset.pl; showPl(); } };
        const body = document.getElementById('pl-body');
        try { renderEps(await playlistItems(pl.id), pl.id, pl.channel, body); }
        catch (e){ if (id === renderId) body.innerHTML = `<div class="notice">Gagal memuat playlist: ${esc(e.message)}</div>`; }
      };
      showPl();
    } catch (e){
      if (id !== renderId) return;
      watch.innerHTML = `<div class="notice">Gagal memuat episode dari YouTube: ${esc(e.message)}</div>`;
      fallback();
    }
  }
  loadWatch();
  const syn = document.getElementById('syn'), mb = document.getElementById('morebtn');
  if (syn.scrollHeight <= syn.clientHeight + 4) mb.remove();
  else mb.onclick = () => { syn.classList.toggle('clamp'); mb.textContent = syn.classList.contains('clamp') ? 'Selengkapnya' : 'Tutup'; };

  // Episodes
  try {
    const d = await api(`/anime/${mid}/episodes`); if (id !== renderId) return;
    const eps = d.data || [];
    if (!eps.length){ document.getElementById('eps-sec').remove(); }
    else {
      document.getElementById('eps-count').textContent = (a.episodes || eps.length) + ' episode';
      document.getElementById('eps').innerHTML = `<div class="ep-list">${eps.slice(0,24).map(e => `
        <div class="ep"><div class="n">${e.mal_id}</div><div>
          <div class="tt">${esc(e.title || 'Episode ' + e.mal_id)}</div>
          <div class="d">${e.aired ? new Date(e.aired).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) : ''}${e.filler ? ' · Filler' : ''}${e.recap ? ' · Rekap' : ''}</div>
        </div></div>`).join('')}</div>`;
    }
  } catch { document.getElementById('eps-sec')?.remove(); }

  // Recommendations
  try {
    const d = await api(`/anime/${mid}/recommendations`); if (id !== renderId) return;
    const recs = (d.data || []).slice(0, 14).map(r => r.entry);
    if (!recs.length) document.getElementById('rec-sec').remove();
    else document.getElementById('rec').innerHTML = recs.map(cardHTML).join('');
  } catch { document.getElementById('rec-sec')?.remove(); }
}

function viewFav(){
  ++renderId;
  const list = store.get();
  $app.innerHTML = `<div class="wrap"><h1 class="page-title">Favorit</h1><div class="sec">
    ${list.length ? `<div class="grid">${list.map(cardHTML).join('')}</div>` :
      `<div class="empty"><b>Belum ada favorit</b>Ketuk ikon hati di halaman anime untuk menyimpannya di sini.</div>`}
  </div></div>`;
}

let lastQuery = '';
function viewSearch(){
  const id = ++renderId;
  $app.innerHTML = `<div class="wrap"><h1 class="page-title">Cari Anime</h1>
    <label class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Judul anime, mis. Frieren" autocomplete="off" value="${esc(lastQuery)}"></label>
    <div class="sec" id="res"></div></div>`;
  const q = document.getElementById('q'), res = document.getElementById('res');
  let t;
  const run = async () => {
    const v = q.value.trim(); lastQuery = v;
    if (v.length < 3){ res.innerHTML = `<div class="empty">Ketik minimal 3 huruf untuk mencari.</div>`; return; }
    res.innerHTML = skelGrid(8);
    try {
      const d = await api(`/anime?q=${encodeURIComponent(v)}&limit=24&sfw=true&order_by=members&sort=desc`);
      if (id !== renderId || q.value.trim() !== v) return;
      res.innerHTML = d.data.length ? `<div class="grid">${uniq(d.data).map(cardHTML).join('')}</div>` : `<div class="empty"><b>Tidak ditemukan</b>Coba kata kunci lain.</div>`;
    } catch(e){ res.innerHTML = errHTML(e.message, 'route()'); }
  };
  q.oninput = () => { clearTimeout(t); t = setTimeout(run, 450); };
  run(); setTimeout(() => q.focus(), 50);
}

const days = [['monday','Senin'],['tuesday','Selasa'],['wednesday','Rabu'],['thursday','Kamis'],['friday','Jumat'],['saturday','Sabtu'],['sunday','Minggu']];
function viewSchedule(){
  const id = ++renderId;
  let cur = days[(new Date().getDay() + 6) % 7][0];
  $app.innerHTML = `<div class="wrap"><h1 class="page-title">Jadwal Tayang</h1>
    <div class="days" id="days">${days.map(([k,l]) => `<button data-d="${k}">${l}</button>`).join('')}</div>
    <div id="sch"></div>${footer}</div>`;
  const box = document.getElementById('sch');
  const load = async () => {
    document.querySelectorAll('#days button').forEach(b => b.classList.toggle('on', b.dataset.d === cur));
    box.innerHTML = skelGrid(10);
    try {
      const d = await api(`/schedules?filter=${cur}&sfw=true&limit=25`); if (id !== renderId) return;
      const list = uniq(d.data).sort((a,b) => (b.members||0) - (a.members||0));
      box.innerHTML = list.length ? `<div class="grid">${list.map(cardHTML).join('')}</div>` : `<div class="empty">Tidak ada jadwal.</div>`;
    } catch(e){ box.innerHTML = errHTML(e.message, 'route()'); }
  };
  document.getElementById('days').onclick = e => { const d = e.target.dataset.d; if (d){ cur = d; load(); } };
  load();
}

/* ---------- Player (trailer & episode) ---------- */
const modal = document.getElementById('modal'), vid = document.getElementById('vid');
const mprev = document.getElementById('mprev'), mnext = document.getElementById('mnext'), myt = document.getElementById('myt');
let player = null;
function openPlayer(p){ player = p; showPlayer(); modal.classList.add('open'); }
function showPlayer(){
  const p = player, cur = p.list[p.index];
  vid.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(cur.videoId)}?autoplay=1&rel=0&playsinline=1" title="${esc(cur.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  document.getElementById('mtitle').textContent = p.title;
  document.getElementById('msub').textContent = p.list.length > 1 ? `#${p.index + 1} · ${cur.title}` : cur.title;
  myt.href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(cur.videoId);
  const multi = p.list.length > 1;
  mprev.hidden = mnext.hidden = !multi;
  mprev.disabled = p.index === 0;
  mnext.disabled = p.index === p.list.length - 1;
  if (p.anime) saveHistory(p);
}
function openTrailer(ytId, name){ openPlayer({ title: name || 'Trailer', list: [{ videoId: ytId, title: 'Trailer resmi' }], index: 0 }); }
function closePlayer(){
  if (!modal.classList.contains('open')) return;
  const wasEpisode = player?.anime;
  modal.classList.remove('open'); vid.innerHTML = ''; player = null;
  if (wasEpisode && !location.hash) route(); // segarkan "Lanjutkan Menonton" di beranda
}
mprev.onclick = () => { if (player && player.index > 0){ player.index--; showPlayer(); } };
mnext.onclick = () => { if (player && player.index < player.list.length - 1){ player.index++; showPlayer(); } };
document.getElementById('mclose').onclick = closePlayer;
modal.onclick = e => { if (e.target === modal) closePlayer(); };
addEventListener('keydown', e => e.key === 'Escape' && closePlayer());

/* ---------- Pengaturan ---------- */
function viewSettings(){
  ++renderId;
  const s = settings.get();
  $app.innerHTML = `<div class="wrap"><h1 class="page-title">Pengaturan</h1>
    <form class="form" id="sf">
      <div class="field"><label for="k">YouTube API key</label>
        <input class="input" id="k" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…" value="${esc(s.ytKey || '')}">
        <small>${CONFIG.YT_API_KEY ? 'Key bawaan dari CONFIG sudah aktif. Isi kolom ini hanya jika ingin memakai key lain.' : 'Disimpan hanya di browser ini dan hanya dikirim ke Google (YouTube Data API).'}</small></div>
      <div class="field"><label for="ch">Channel resmi yang dipakai</label>
        <textarea class="input" id="ch">${esc(ytChannels().join('\n'))}</textarea>
        <small>Satu nama channel per baris; urutan teratas diprioritaskan. Hanya video dari channel ini yang diputar.</small></div>
      <div class="btn-row">
        <button class="btn-lime" type="submit">Simpan</button>
        <button class="btn-ghost" type="button" id="test">Tes koneksi</button>
        <button class="btn-ghost" type="button" id="reset">Channel default</button>
      </div>
      <div class="status" id="st" role="status"></div>
    </form>
    <section class="sec"><div class="sec-h"><h2>Cara membuat API key</h2></div>
      <ol class="steps">
        <li>Buka <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">Google Cloud Console</a>, lalu buat project baru.</li>
        <li>Masuk ke <b>APIs &amp; Services › Library</b>, cari dan aktifkan <b>YouTube Data API v3</b>.</li>
        <li>Masuk ke <b>Credentials</b>, pilih <b>Create credentials › API key</b>.</li>
        <li>Batasi key: <b>Website restrictions</b> diisi domain situsmu, dan <b>API restrictions</b> hanya YouTube Data API v3.</li>
        <li>Tempel key di atas, tekan <b>Simpan</b>, lalu <b>Tes koneksi</b>.</li>
      </ol>
    </section>
    <section class="sec"><div class="sec-h"><h2>Data</h2></div>
      <div class="btn-row"><button class="btn-ghost" id="clr-cache">Hapus cache YouTube</button><button class="btn-ghost" id="clr-hist">Hapus riwayat tonton</button></div>
      <div class="status" id="st2" role="status" style="margin-top:10px"></div>
    </section>
    ${footer}</div>`;
  const st = document.getElementById('st'), st2 = document.getElementById('st2');
  const msg = (el, text, ok) => { el.textContent = text; el.className = 'status ' + (ok ? 'ok' : 'bad'); };
  const ch = document.getElementById('ch');
  document.getElementById('sf').onsubmit = e => {
    e.preventDefault();
    const channels = ch.value.split('\n').map(x => x.trim()).filter(Boolean);
    settings.set({ ...settings.get(), ytKey: document.getElementById('k').value.trim(), channels });
    ytCache.clear();
    msg(st, 'Tersimpan.', true);
  };
  document.getElementById('reset').onclick = () => { ch.value = CONFIG.CHANNELS.join('\n'); msg(st, 'Daftar channel dikembalikan. Tekan Simpan untuk menerapkan.', true); };
  document.getElementById('test').onclick = async () => {
    const key = document.getElementById('k').value.trim() || CONFIG.YT_API_KEY;
    if (!key) return msg(st, 'Isi API key dulu.', false);
    st.textContent = 'Menguji…'; st.className = 'status';
    try {
      const r = await fetch('https://www.googleapis.com/youtube/v3/i18nRegions?part=snippet&hl=id&key=' + encodeURIComponent(key));
      const j = await r.json().catch(() => ({}));
      if (r.ok) msg(st, 'Berhasil terhubung ke YouTube Data API.', true);
      else msg(st, 'Gagal: ' + (j.error?.message?.replace(/<[^>]+>/g, '') || 'HTTP ' + r.status), false);
    } catch (e){ msg(st, 'Gagal: ' + e.message, false); }
  };
  document.getElementById('clr-cache').onclick = () => { ytCache.clear(); msg(st2, 'Cache YouTube dihapus.', true); };
  document.getElementById('clr-hist').onclick = () => { hist.set([]); msg(st2, 'Riwayat tonton dihapus.', true); };
}

/* ---------- Router (hash) ---------- */
function setChrome(tab, nav){
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  document.getElementById('topbar').style.display = nav === 'detail' ? 'none' : '';
}
function route(){
  const h = location.hash.slice(1);
  if (modal.classList.contains('open')){ modal.classList.remove('open'); vid.innerHTML = ''; player = null; }
  scrollTo(0, 0);
  if (h === 'pengaturan'){ setChrome(null, 'pengaturan'); return viewSettings(); }
  let m;
  if ((m = h.match(/^anime-(\d+)$/))){ setChrome(null, 'detail'); return viewDetail(m[1]); }
  if ((m = h.match(/^tab-(airing|movie|upcoming)$/))){ setChrome(m[1], 'home'); return viewList(m[1]); }
  if (h === 'favorit'){ setChrome(null, 'favorit'); return viewFav(); }
  if (h === 'cari'){ setChrome(null, 'cari'); return viewSearch(); }
  if (h === 'jadwal'){ setChrome(null, 'jadwal'); return viewSchedule(); }
  setChrome('home', 'home'); viewHome();
}
document.getElementById('seg').onclick = e => {
  const t = e.target.dataset.tab; if (!t) return;
  location.hash = t === 'home' ? '' : 'tab-' + t;
  if (t === 'home' && !location.hash) route();
};
document.querySelector('[data-nav="home"]').onclick = e => { e.preventDefault(); if (location.hash) location.hash = ''; else route(); };
addEventListener('hashchange', route);
route();
</script>
